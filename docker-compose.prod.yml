name: studystack-prod

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      # Trust X-Forwarded-For / X-Forwarded-Proto from Caddy. Safe only because the api
      # service publishes no ports, so Caddy is the only thing that can reach it.
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    build: ./frontend
    restart: unless-stopped
    environment:
      # The Caddyfile's site address. On the server, the MagicDNS name, which turns on
      # HTTPS. Falls back to :80 (plain HTTP, no certificate) for local testing.
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      # Publish only on CADDY_BIND_ADDRESS: the VM's Tailscale IP on the server,
      # 127.0.0.1 (this computer only) when the variable isn't set, e.g. local testing.
      - "${CADDY_BIND_ADDRESS:-127.0.0.1}:80:80"
      - "${CADDY_BIND_ADDRESS:-127.0.0.1}:443:443"
      - "${CADDY_BIND_ADDRESS:-127.0.0.1}:443:443/udp"
    volumes:
      # The host's tailscaled socket folder, so Caddy can ask it for the *.ts.net certificate.
      - /var/run/tailscale:/var/run/tailscale
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

volumes:
  postgres-data:
  caddy-data:
  caddy-config: