services:
  postgres:
    image: postgres:18
    container_name: studystack-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data: