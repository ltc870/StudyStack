<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <rect width="390" height="844" fill="#F6F4EF"/>
  <rect x="0" y="0" width="390" height="48" fill="#FFFFFF"/>
  <line x1="0" y1="48" x2="390" y2="48" stroke="#E3DFD5"/>
  <text x="20" y="24.0" dominant-baseline="middle" font-family="'Source Serif 4', Georgia, serif" font-size="15" font-weight="600" fill="#3E4C74">StudyStack</text>
  <rect x="300" y="7.0" width="70" height="34" rx="8" fill="#6B675E"/>
  <text x="335.0" y="24.0" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#FFFFFF">Logout</text>
  <!-- Manage Cards behind the dialog -->
  <text x="20" y="92" dominant-baseline="middle" font-family="'Source Serif 4', Georgia, serif" font-size="24" font-weight="600" fill="#2A2924">C# Fundamentals</text>
  <rect x="20" y="128" width="350" height="76" rx="8" fill="#FFFFFF" stroke="#E3DFD5"/>
  <text x="36" y="156" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="15" font-weight="600" fill="#2A2924">What does async do in C#?</text>
  <rect x="0" y="0" width="390" height="844" rx="0" fill="#000000" opacity="0.45"/>
  <!-- Card editor -->
  <clipPath id="dlg"><rect x="20.0" y="132" width="350" height="580.5" rx="14"/></clipPath>
  <rect x="20.0" y="132" width="350" height="580.5" rx="14" fill="#FFFFFF" stroke="#E3DFD5"/>
  <g clip-path="url(#dlg)">
  <text x="44.0" y="171" dominant-baseline="middle" font-family="'Source Serif 4', Georgia, serif" font-size="19" font-weight="600" fill="#2A2924">Edit Card</text>
  <path d="M330.0,165 L342.0,177 M342.0,165 L330.0,177" stroke="#6B675E" stroke-width="1.7" stroke-linecap="round"/>
  <text x="44.0" y="216" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="600" letter-spacing="1" fill="#6B675E">QUESTION</text>
  <rect x="44.0" y="229.5" width="302" height="110" rx="8" fill="#FBFAF6" stroke="#E3DFD5"/>
  <text x="58.0" y="251.5" dominant-baseline="middle" font-family="'JetBrains Mono', monospace" font-size="14" fill="#2A2924">What does the `async`</text>
  <text x="58.0" y="273.5" dominant-baseline="middle" font-family="'JetBrains Mono', monospace" font-size="14" fill="#2A2924">keyword actually do</text>
  <text x="58.0" y="295.5" dominant-baseline="middle" font-family="'JetBrains Mono', monospace" font-size="14" fill="#2A2924">in C#?</text>
  <text x="44.0" y="369.0" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="600" letter-spacing="1" fill="#6B675E">ANSWER</text>
  <rect x="44.0" y="382.5" width="302" height="110" rx="8" fill="#FBFAF6" stroke="#E3DFD5"/>
  <text x="58.0" y="404.5" dominant-baseline="middle" font-family="'JetBrains Mono', monospace" font-size="14" fill="#2A2924">It marks a method as</text>
  <text x="58.0" y="426.5" dominant-baseline="middle" font-family="'JetBrains Mono', monospace" font-size="14" fill="#2A2924">asynchronous, so awaited</text>
  <text x="58.0" y="448.5" dominant-baseline="middle" font-family="'JetBrains Mono', monospace" font-size="14" fill="#2A2924">calls can yield...</text>
  <!-- NEW: Substack, a native select; "Not in a substack" is the first option -->
  <text x="44.0" y="522.0" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="600" letter-spacing="1" fill="#6B675E">SUBSTACK</text>
  <rect x="44.0" y="535.5" width="302" height="40" rx="8" fill="#FFFFFF" stroke="#E3DFD5"/>
  <text x="58.0" y="555.5" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="14" fill="#2A2924">Async/Await</text>
  <path d="M323.0,553.0 L328.0,558.0 L333.0,553.0" fill="none" stroke="#6B675E" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="44.0" y="593.5" width="40" height="22" rx="11" fill="#5E8272"/>
  <circle cx="73.0" cy="604.5" r="8" fill="#FFFFFF"/>
  <text x="96.0" y="604.5" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="14" fill="#2A2924">Monospace font</text>
  <text x="328.0" y="604.5" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="14" font-weight="500" text-anchor="end" fill="#3E4C74">Formatting help</text>
  <path d="M333.0,602.0 L338.0,607.0 L343.0,602.0" fill="none" stroke="#3E4C74" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="262.0" y="648.5" width="84" height="40" rx="8" fill="#3E4C74"/>
  <text x="304.0" y="668.5" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#FFFFFF">Save</text>
  <text x="252.0" y="668.5" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="15" text-anchor="end" fill="#6B675E">Cancel</text>
  </g>
  <text x="195.0" y="815" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle" font-style="italic" fill="#6B675E">Substack sits under Answer. A new card starts on</text>
  <text x="195.0" y="830" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle" font-style="italic" fill="#6B675E">Not in a substack; saving a change moves the card.</text>
</svg>
