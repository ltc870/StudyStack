  <rect x="734" y="10" width="78" height="40" rx="8" fill="#6B675E"/>
  <text x="773" y="30" text-anchor="middle" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Logout</text>
  <text x="422.0" y="144" text-anchor="middle" dominant-baseline="middle" font-family="'Source Serif 4', Georgia, serif" font-size="48" font-weight="700" fill="#3E4C74">StudyStack</text>
