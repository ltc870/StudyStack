  <rect x="48.75" y="407.75" width="20.5" height="20.5" rx="4" fill="#FFFFFF" stroke="#6B675E" stroke-width="1.5"/>
  <text x="86" y="408.4" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="19" font-weight="600" fill="#2A2924">When to use ConfigureAwait(false)?</text>
  <text x="86" y="435.28" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="15" fill="#6B675E">In library async code, so...</text>
