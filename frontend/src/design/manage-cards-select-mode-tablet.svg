  <text x="86" y="296.4" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="19" font-weight="600" fill="#2A2924">What does async do in C#?</text>
  <text x="86" y="323.28" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="15" fill="#6B675E">Marks a method as asynchronous...</text>
