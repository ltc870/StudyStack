<svg xmlns="http://www.w3.org/2000/svg" width="768" height="1024" viewBox="0 0 768 1024">
  <rect width="768" height="1024" fill="#F6F4EF"/>
  <rect x="0" y="0" width="768" height="60" fill="#FFFFFF"/>
  <line x1="0" y1="60" x2="768" y2="60" stroke="#E3DFD5"/>
  <text x="32" y="30" dominant-baseline="middle" font-family="'Source Serif 4', Georgia, serif" font-size="20" font-weight="600" fill="#3E4C74">StudyStack</text>
  <circle cx="718" cy="30" r="18" fill="#3E4C74"/>
  <text x="718" y="30" text-anchor="middle" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">LC</text>
  <path d="M44,90 L34,100 L44,110" fill="none" stroke="#2A2924" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="60" y="106" font-family="'Source Serif 4', Georgia, serif" font-size="26" font-weight="600" fill="#2A2924">C# Fundamentals</text>
  <rect x="32" y="180" width="704" height="96" rx="10" fill="#FFFFFF" stroke="#E3DFD5"/>
  <text x="52" y="220" font-family="'Inter', sans-serif" font-size="19" font-weight="600" fill="#2A2924">What is dependency injection...</text>
  <text x="52" y="246" font-family="'Inter', sans-serif" font-size="15" fill="#6B675E">...and why does ASP.NET Core use it?</text>
  <g transform="translate(704,224) scale(1.3)">
    <rect x="-7" y="-6" width="14" height="3" rx="1" fill="#B15C3E"/>
    <rect x="-5" y="-2" width="10" height="14" rx="2" fill="none" stroke="#B15C3E" stroke-width="1.5"/>
    <line x1="-2" y1="1" x2="-2" y2="9" stroke="#B15C3E" stroke-width="1.5"/>
    <line x1="2" y1="1" x2="2" y2="9" stroke="#B15C3E" stroke-width="1.5"/>
  </g>
  <rect x="0" y="0" width="768" height="1024" fill="#000000" opacity="0.45"/>
  <rect x="104" y="220" width="560" height="568" rx="14" fill="#FFFFFF" stroke="#E3DFD5"/>
  <text x="136" y="276" font-family="'Source Serif 4', Georgia, serif" font-size="22" font-weight="600" fill="#2A2924">Add Card</text>
  <g transform="translate(632,268)" stroke="#6B675E" stroke-width="2" stroke-linecap="round">
    <line x1="-7" y1="-7" x2="7" y2="7"/>
    <line x1="7" y1="-7" x2="-7" y2="7"/>
  </g>
  <text x="136" y="320" font-family="'Inter', sans-serif" font-size="12" font-weight="600" letter-spacing="1" fill="#6B675E">QUESTION</text>
  <rect x="136" y="332" width="496" height="130" rx="8" fill="#FBFAF6" stroke="#E3DFD5"/>
  <text x="152" y="364" font-family="'JetBrains Mono', monospace" font-size="16" fill="#2A2924">
    <tspan x="152" dy="0">What does the `async` keyword</tspan>
    <tspan x="152" dy="26">actually do in C#?</tspan>
  </text>
  <text x="136" y="492" font-family="'Inter', sans-serif" font-size="12" font-weight="600" letter-spacing="1" fill="#6B675E">ANSWER</text>
  <rect x="136" y="504" width="496" height="130" rx="8" fill="#FBFAF6" stroke="#E3DFD5"/>
  <text x="152" y="536" font-family="'JetBrains Mono', monospace" font-size="16" fill="#2A2924">
    <tspan x="152" dy="0">It marks a method as asynchronous,</tspan>
    <tspan x="152" dy="26">allowing awaited calls to yield</tspan>
    <tspan x="152" dy="26">control without blocking a thread.</tspan>
  </text>
  <rect x="136" y="666" width="48" height="26" rx="13" fill="#5E8272"/>
  <circle cx="171" cy="679" r="11" fill="#FFFFFF"/>
  <text x="198" y="679" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="15" fill="#2A2924">Monospace font</text>
  <text x="516" y="734" text-anchor="end" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="16" fill="#6B675E">Cancel</text>
  <rect x="536" y="712" width="96" height="44" rx="8" fill="#3E4C74"/>
  <text x="584" y="734" text-anchor="middle" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">Save</text>
</svg>
