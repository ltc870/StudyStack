<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <rect width="1280" height="800" fill="#F6F4EF"/>
  <!-- dimmed Manage Cards screen behind the modal -->
  <rect x="0" y="0" width="1280" height="64" fill="#FFFFFF"/>
  <line x1="0" y1="64" x2="1280" y2="64" stroke="#E3DFD5"/>
  <text x="48" y="32" dominant-baseline="middle" font-family="'Source Serif 4', Georgia, serif" font-size="18" font-weight="600" fill="#3E4C74">StudyStack</text>
  <circle cx="1214" cy="32" r="18" fill="#3E4C74"/>
  <text x="1214" y="32" text-anchor="middle" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">LC</text>
  <text x="72" y="108" font-family="'Source Serif 4', Georgia, serif" font-size="28" font-weight="600" fill="#2A2924">C# Fundamentals</text>
  <rect x="48" y="160" width="1184" height="88" rx="10" fill="#FFFFFF" stroke="#E3DFD5"/>
  <text x="72" y="194" font-family="'Inter', sans-serif" font-size="17" font-weight="600" fill="#2A2924">What is dependency injection and why does ASP.NET Core use it by default?</text>
  <rect x="48" y="264" width="1184" height="88" rx="10" fill="#FFFFFF" stroke="#E3DFD5"/>
  <text x="72" y="298" font-family="'Inter', sans-serif" font-size="17" font-weight="600" fill="#2A2924">What is the difference between IEnumerable and IQueryable?</text>

  <rect x="0" y="0" width="1280" height="800" fill="#000000" opacity="0.45"/>

  <!-- modal dialog -->
  <rect x="320" y="160" width="640" height="480" rx="14" fill="#FFFFFF" stroke="#E3DFD5"/>
  <text x="352" y="200" font-family="'Source Serif 4', Georgia, serif" font-size="22" font-weight="600" fill="#2A2924">Add Card</text>
  <g transform="translate(936,192)" stroke="#6B675E" stroke-width="1.8" stroke-linecap="round">
    <line x1="-6" y1="-6" x2="6" y2="6"/>
    <line x1="6" y1="-6" x2="-6" y2="6"/>
  </g>

  <text x="352" y="230" font-family="'Inter', sans-serif" font-size="11" font-weight="600" letter-spacing="1" fill="#6B675E">QUESTION</text>
  <rect x="352" y="240" width="576" height="100" rx="8" fill="#FBFAF6" stroke="#E3DFD5"/>
  <text x="366" y="266" font-family="'JetBrains Mono', monospace" font-size="14" fill="#2A2924">
    <tspan x="366" dy="0">What does the `async` keyword</tspan>
    <tspan x="366" dy="22">actually do in C#?</tspan>
  </text>

  <text x="352" y="368" font-family="'Inter', sans-serif" font-size="11" font-weight="600" letter-spacing="1" fill="#6B675E">ANSWER</text>
  <rect x="352" y="378" width="576" height="100" rx="8" fill="#FBFAF6" stroke="#E3DFD5"/>
  <text x="366" y="404" font-family="'JetBrains Mono', monospace" font-size="14" fill="#2A2924">
    <tspan x="366" dy="0">It marks a method as asynchronous,</tspan>
    <tspan x="366" dy="22">allowing awaited calls to yield</tspan>
    <tspan x="366" dy="22">control without blocking a thread.</tspan>
  </text>

  <rect x="352" y="509" width="40" height="22" rx="11" fill="#5E8272"/>
  <circle cx="381" cy="520" r="9" fill="#FFFFFF"/>
  <text x="404" y="520" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="14" fill="#2A2924">Monospace font</text>

  <text x="812" y="576" text-anchor="end" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="15" fill="#6B675E">Cancel</text>
  <rect x="832" y="556" width="96" height="40" rx="8" fill="#3E4C74"/>
  <text x="880" y="576" text-anchor="middle" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">Save</text>
</svg>
