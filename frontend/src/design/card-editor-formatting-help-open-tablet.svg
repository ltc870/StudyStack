<svg xmlns="http://www.w3.org/2000/svg" width="768" height="1024" viewBox="0 0 768 1024">
  <rect width="768" height="1024" fill="#F6F4EF"/>
  <rect x="0" y="0" width="768" height="60" fill="#FFFFFF"/>
  <line x1="0" y1="60" x2="768" y2="60" stroke="#E3DFD5"/>
  <text x="32" y="30.0" dominant-baseline="middle" font-family="'Source Serif 4', Georgia, serif" font-size="20" font-weight="600" fill="#3E4C74">StudyStack</text>
  <rect x="658" y="10.0" width="78" height="40" rx="8" fill="#6B675E"/>
  <text x="697.0" y="30.0" text-anchor="middle" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Logout</text>
  <!-- Manage Cards behind the dialog -->
  <text x="32" y="104" dominant-baseline="middle" font-family="'Source Serif 4', Georgia, serif" font-size="28" font-weight="600" fill="#2A2924">C# Fundamentals</text>
  <rect x="32" y="140" width="704" height="76" rx="8" fill="#FFFFFF" stroke="#E3DFD5"/>
  <text x="48" y="168" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="15" font-weight="600" fill="#2A2924">What is dependency injection?</text>
  <text x="48" y="190" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="13" fill="#6B675E">A way to give a class what it needs...</text>
  <rect x="0" y="0" width="768" height="1024" fill="#000000" opacity="0.45"/>
  <!-- Card editor with Formatting help open -->
  <clipPath id="dlg"><rect x="104.0" y="46" width="560" height="932" rx="14"/></clipPath>
  <rect x="104.0" y="46" width="560" height="932" rx="14" fill="#FFFFFF" stroke="#E3DFD5"/>
  <g clip-path="url(#dlg)">
  <text x="136.0" y="93.4" dominant-baseline="middle" font-family="'Source Serif 4', Georgia, serif" font-size="22" font-weight="600" fill="#2A2924">Add Card</text>
  <path d="M622.0,87.4 L634.0,99.4 M634.0,87.4 L622.0,99.4" stroke="#6B675E" stroke-width="1.7" stroke-linecap="round"/>
  <text x="136.0" y="138.8" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#6B675E" letter-spacing="1">QUESTION</text>
  <rect x="136.0" y="152.8" width="496" height="130" rx="8" fill="#FBFAF6" stroke="#E3DFD5"/>
  <text x="150.0" y="174.8" dominant-baseline="middle" font-family="'JetBrains Mono', monospace" font-size="14" fill="#2A2924">What does the `async` keyword</text>
  <text x="150.0" y="196.8" dominant-baseline="middle" font-family="'JetBrains Mono', monospace" font-size="14" fill="#2A2924">actually do in C#?</text>
  <text x="136.0" y="312.8" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#6B675E" letter-spacing="1">ANSWER</text>
  <rect x="136.0" y="326.8" width="496" height="130" rx="8" fill="#FBFAF6" stroke="#E3DFD5"/>
  <text x="150.0" y="348.8" dominant-baseline="middle" font-family="'JetBrains Mono', monospace" font-size="14" fill="#2A2924">It marks a method as asynchronous,</text>
  <text x="150.0" y="370.8" dominant-baseline="middle" font-family="'JetBrains Mono', monospace" font-size="14" fill="#2A2924">so awaited calls can yield...</text>
  <rect x="136.0" y="480.8" width="40" height="22" rx="11" fill="#5E8272"/><circle cx="165.0" cy="491.8" r="8" fill="#FFFFFF"/>
  <text x="188.0" y="491.8" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="15" fill="#2A2924">Monospace font</text>
  <!-- Formatting help: a text button; aria-expanded shows whether the panel is open -->
  <text x="614.0" y="491.8" text-anchor="end" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="15" font-weight="500" fill="#3E4C74">Formatting help</text>
  <path d="M621.0,494.8 L626.0,489.8 L631.0,494.8" fill="none" stroke="#3E4C74" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="136.5" y="519.3" width="495" height="354" rx="8" fill="#FBFAF6" stroke="#E3DFD5"/>
  <text x="152.0" y="540.8" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#6B675E" letter-spacing="1">YOU TYPE</text>
  <text x="342.0" y="540.8" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#6B675E" letter-spacing="1">YOU GET</text>
  <line x1="152.0" y1="558.8" x2="616.0" y2="558.8" stroke="#E3DFD5"/>
  <text x="152.0" y="574.8" dominant-baseline="middle" font-family="'JetBrains Mono', monospace" font-size="13.5" fill="#2A2924">**bold**</text>
  <text x="342.0" y="574.8" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#2A2924">bold</text>
  <line x1="152.0" y1="590.8" x2="616.0" y2="590.8" stroke="#E3DFD5"/>
  <text x="152.0" y="606.8" dominant-baseline="middle" font-family="'JetBrains Mono', monospace" font-size="13.5" fill="#2A2924">*italic*</text>
  <text x="342.0" y="606.8" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="15" fill="#2A2924" font-style="italic">italic</text>
  <line x1="152.0" y1="622.8" x2="616.0" y2="622.8" stroke="#E3DFD5"/>
  <text x="152.0" y="638.8" dominant-baseline="middle" font-family="'JetBrains Mono', monospace" font-size="13.5" fill="#2A2924">- item</text>
  <circle cx="346.0" cy="638.8" r="2.5" fill="#2A2924"/>
  <text x="356.0" y="638.8" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="15" fill="#2A2924">item</text>
  <line x1="152.0" y1="654.8" x2="616.0" y2="654.8" stroke="#E3DFD5"/>
  <text x="152.0" y="670.8" dominant-baseline="middle" font-family="'JetBrains Mono', monospace" font-size="13.5" fill="#2A2924">1. item</text>
  <text x="342.0" y="670.8" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="15" fill="#2A2924">1.  item</text>
  <line x1="152.0" y1="686.8" x2="616.0" y2="686.8" stroke="#E3DFD5"/>
  <text x="152.0" y="702.8" dominant-baseline="middle" font-family="'JetBrains Mono', monospace" font-size="13.5" fill="#2A2924">`List&lt;User&gt;`</text>
  <rect x="340.0" y="691.8" width="91" height="22" rx="4" fill="#F6F4EF"/>
  <text x="345.0" y="702.8" dominant-baseline="middle" font-family="'JetBrains Mono', monospace" font-size="13.5" fill="#2A2924">List&lt;User&gt;</text>
  <line x1="152.0" y1="718.8" x2="616.0" y2="718.8" stroke="#E3DFD5"/>
  <text x="152.0" y="736.8" dominant-baseline="middle" font-family="'JetBrains Mono', monospace" font-size="13.5" fill="#2A2924">```csharp</text>
  <text x="152.0" y="754.8" dominant-baseline="middle" font-family="'JetBrains Mono', monospace" font-size="13.5" fill="#2A2924">var count = 1;</text>
  <text x="152.0" y="772.8" dominant-baseline="middle" font-family="'JetBrains Mono', monospace" font-size="13.5" fill="#2A2924">```</text>
  <rect x="342.0" y="727.8" width="274.0" height="54" rx="6" fill="#F6F4EF" stroke="#E3DFD5"/>
  <text x="352.0" y="754.8" dominant-baseline="middle" font-family="'JetBrains Mono', monospace" font-size="13.5"><tspan fill="#3E4C74">var</tspan><tspan fill="#2A2924"> count = </tspan><tspan fill="#96492F">1</tspan><tspan fill="#6B675E">;</tspan></text>
  <text x="152.0" y="811.8" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="13" fill="#6B675E">Code colors: csharp, typescript, javascript, html, css, scss, sql,</text>
  <text x="152.0" y="830.8" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="13" fill="#6B675E">json, bash, c, cpp, python, java.</text>
  <text x="152.0" y="849.8" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="13" fill="#6B675E">Press Enter once for a new line.</text>
  <rect x="536.0" y="905.8" width="96" height="40" rx="8" fill="#3E4C74"/>
  <text x="584.0" y="925.8" text-anchor="middle" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">Save</text>
  <text x="526.0" y="925.8" text-anchor="end" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="15" fill="#6B675E">Cancel</text>
  </g>
</svg>
