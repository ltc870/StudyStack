<svg xmlns="http://www.w3.org/2000/svg" width="768" height="1024" viewBox="0 0 768 1024">
  <rect width="768" height="1024" fill="#F6F4EF"/>
  <rect x="0" y="0" width="768" height="60" fill="#FFFFFF"/>
  <line x1="0" y1="60" x2="768" y2="60" stroke="#E3DFD5"/>
  <text x="32" y="30.0" dominant-baseline="middle" font-family="'Source Serif 4', Georgia, serif" font-size="20" font-weight="600" fill="#3E4C74">StudyStack</text>
  <rect x="658" y="10.0" width="78" height="40" rx="8" fill="#6B675E"/>
  <text x="697.0" y="30.0" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#FFFFFF">Logout</text>
  <!-- Manage Cards behind the dialog -->
  <text x="32" y="104" dominant-baseline="middle" font-family="'Source Serif 4', Georgia, serif" font-size="28" font-weight="600" fill="#2A2924">C# Fundamentals</text>
  <rect x="32" y="140" width="704" height="76" rx="8" fill="#FFFFFF" stroke="#E3DFD5"/>
  <text x="48" y="168" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="15" font-weight="600" fill="#2A2924">What does async do in C#?</text>
  <rect x="0" y="0" width="768" height="1024" rx="0" fill="#000000" opacity="0.45"/>
  <!-- Card editor -->
  <clipPath id="dlg"><rect x="104.0" y="194" width="560" height="636.5" rx="14"/></clipPath>
  <rect x="104.0" y="194" width="560" height="636.5" rx="14" fill="#FFFFFF" stroke="#E3DFD5"/>
  <g clip-path="url(#dlg)">
  <text x="136.0" y="241" dominant-baseline="middle" font-family="'Source Serif 4', Georgia, serif" font-size="22" font-weight="600" fill="#2A2924">Edit Card</text>
  <path d="M616.0,235 L628.0,247 M628.0,235 L616.0,247" stroke="#6B675E" stroke-width="1.7" stroke-linecap="round"/>
  <text x="136.0" y="286" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="600" letter-spacing="1" fill="#6B675E">QUESTION</text>
  <rect x="136.0" y="299.5" width="496" height="130" rx="8" fill="#FBFAF6" stroke="#E3DFD5"/>
  <text x="150.0" y="321.5" dominant-baseline="middle" font-family="'JetBrains Mono', monospace" font-size="14" fill="#2A2924">What does the `async` keyword</text>
  <text x="150.0" y="343.5" dominant-baseline="middle" font-family="'JetBrains Mono', monospace" font-size="14" fill="#2A2924">actually do in C#?</text>
  <text x="136.0" y="459.0" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="600" letter-spacing="1" fill="#6B675E">ANSWER</text>
  <rect x="136.0" y="472.5" width="496" height="130" rx="8" fill="#FBFAF6" stroke="#E3DFD5"/>
  <text x="150.0" y="494.5" dominant-baseline="middle" font-family="'JetBrains Mono', monospace" font-size="14" fill="#2A2924">It marks a method as asynchronous,</text>
  <text x="150.0" y="516.5" dominant-baseline="middle" font-family="'JetBrains Mono', monospace" font-size="14" fill="#2A2924">so awaited calls can yield...</text>
  <!-- NEW: Substack, a native select; "Not in a substack" is the first option -->
  <text x="136.0" y="632.0" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="600" letter-spacing="1" fill="#6B675E">SUBSTACK</text>
  <rect x="136.0" y="645.5" width="496" height="40" rx="8" fill="#FFFFFF" stroke="#E3DFD5"/>
  <text x="150.0" y="665.5" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="15" fill="#2A2924">Async/Await</text>
  <path d="M609.0,663.0 L614.0,668.0 L619.0,663.0" fill="none" stroke="#6B675E" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="136.0" y="703.5" width="40" height="22" rx="11" fill="#5E8272"/>
  <circle cx="165.0" cy="714.5" r="8" fill="#FFFFFF"/>
  <text x="188.0" y="714.5" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="15" fill="#2A2924">Monospace font</text>
  <text x="614.0" y="714.5" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="14" font-weight="500" text-anchor="end" fill="#3E4C74">Formatting help</text>
  <path d="M619.0,712.0 L624.0,717.0 L629.0,712.0" fill="none" stroke="#3E4C74" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="548.0" y="758.5" width="84" height="40" rx="8" fill="#3E4C74"/>
  <text x="590.0" y="778.5" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#FFFFFF">Save</text>
  <text x="538.0" y="778.5" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="15" text-anchor="end" fill="#6B675E">Cancel</text>
  </g>
  <text x="384.0" y="1010" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle" font-style="italic" fill="#6B675E">Substack sits under Answer. A new card starts on Not in a substack; saving a change moves the card.</text>
</svg>
