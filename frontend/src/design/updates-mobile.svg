<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <rect width="390" height="844" fill="#F6F4EF"/>
  <rect x="0" y="0" width="390" height="48" fill="#FFFFFF"/>
  <line x1="0" y1="48" x2="390" y2="48" stroke="#E3DFD5"/>
  <text x="20" y="24.0" dominant-baseline="middle" font-family="'Source Serif 4', Georgia, serif" font-size="15" font-weight="600" fill="#3E4C74">StudyStack</text>
  <rect x="300" y="7.0" width="70" height="34" rx="8" fill="#6B675E"/>
  <text x="335.0" y="24.0" text-anchor="middle" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Logout</text>
  <path d="M34,78 L26,86 L34,94" fill="none" stroke="#2A2924" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="48" y="87" dominant-baseline="middle" font-family="'Source Serif 4', Georgia, serif" font-size="28" font-weight="600" fill="#2A2924">Updates</text>
  <text x="20" y="124" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="13" fill="#6B675E">What changed in each release, newest first.</text>
  <!-- Release notes: one card per release, newest first; the list scrolls with the page -->
  <rect x="20.5" y="148.5" width="349" height="204" rx="12" fill="#FFFFFF" stroke="#E3DFD5"/>
  <text x="36" y="170.6" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#6B675E" letter-spacing="1">OCT 21, 2026</text>
  <text x="36" y="196.2" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="16" font-weight="600" fill="#2A2924">Jump to any card</text>
  <circle cx="40" cy="225.9" r="2.5" fill="#6B675E"/>
  <text x="54" y="225.9" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="14" fill="#2A2924">Tap Cards on the Study screen (the panel</text>
  <text x="54" y="246.9" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="14" fill="#2A2924">icon next to the stack name on a phone) to</text>
  <text x="54" y="267.9" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="14" fill="#2A2924">see every card in the stack. Tap one to</text>
  <text x="54" y="288.9" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="14" fill="#2A2924">jump straight to it; the list stays open.</text>
  <circle cx="40" cy="309.9" r="2.5" fill="#6B675E"/>
  <text x="54" y="309.9" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="14" fill="#2A2924">On an iPhone in landscape, the top bar now</text>
  <text x="54" y="330.9" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="14" fill="#2A2924">reaches the edges of the screen.</text>
  <rect x="20.5" y="365.5" width="349" height="120" rx="12" fill="#FFFFFF" stroke="#E3DFD5"/>
  <text x="36" y="387.6" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#6B675E" letter-spacing="1">OCT 20, 2026</text>
  <text x="36" y="413.2" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="16" font-weight="600" fill="#2A2924">Faster start</text>
  <circle cx="40" cy="442.9" r="2.5" fill="#6B675E"/>
  <text x="54" y="442.9" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="14" fill="#2A2924">StudyStack opens faster, because it</text>
  <text x="54" y="463.9" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="14" fill="#2A2924">downloads less when it starts.</text>
  <rect x="20.5" y="498.5" width="349" height="183" rx="12" fill="#FFFFFF" stroke="#E3DFD5"/>
  <text x="36" y="520.6" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#6B675E" letter-spacing="1">OCT 14, 2026</text>
  <text x="36" y="546.2" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="16" font-weight="600" fill="#2A2924">Format your cards</text>
  <circle cx="40" cy="575.9" r="2.5" fill="#6B675E"/>
  <text x="54" y="575.9" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="14" fill="#2A2924">Questions and answers now support</text>
  <text x="54" y="596.9" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="14" fill="#2A2924">markdown: bold, italics, lists, code, and</text>
  <text x="54" y="617.9" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="14" fill="#2A2924">code blocks with colors.</text>
  <circle cx="40" cy="638.9" r="2.5" fill="#6B675E"/>
  <text x="54" y="638.9" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="14" fill="#2A2924">Tap Formatting help in the card editor to</text>
  <text x="54" y="659.9" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="14" fill="#2A2924">see how.</text>
  <rect x="20.5" y="694.5" width="349" height="267" rx="12" fill="#FFFFFF" stroke="#E3DFD5"/>
  <text x="36" y="716.6" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#6B675E" letter-spacing="1">OCT 12, 2026</text>
  <text x="36" y="742.2" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="16" font-weight="600" fill="#2A2924">StudyStack is online</text>
  <circle cx="40" cy="771.9" r="2.5" fill="#6B675E"/>
  <text x="54" y="771.9" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="14" fill="#2A2924">Make stacks of cards, each with a question</text>
  <text x="54" y="792.9" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="14" fill="#2A2924">and an answer, and find any of them with</text>
  <text x="54" y="813.9" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="14" fill="#2A2924">search.</text>
  <circle cx="40" cy="834.9" r="2.5" fill="#6B675E"/>
  <text x="54" y="834.9" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="14" fill="#2A2924">Study a stack: Flip shows the answer, and</text>
  <text x="54" y="855.9" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="14" fill="#2A2924">Previous and Next move between cards.</text>
  <circle cx="40" cy="876.9" r="2.5" fill="#6B675E"/>
  <text x="54" y="876.9" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="14" fill="#2A2924">Turn on Monospace font in the card editor</text>
  <text x="54" y="897.9" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="14" fill="#2A2924">for cards that are mostly code.</text>
  <circle cx="40" cy="918.9" r="2.5" fill="#6B675E"/>
  <text x="54" y="918.9" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="14" fill="#2A2924">Add it to your home screen: in Safari, tap</text>
  <text x="54" y="939.9" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="14" fill="#2A2924">Share, then Add to Home Screen.</text>
</svg>
