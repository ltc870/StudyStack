<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <rect width="1280" height="800" fill="#F6F4EF"/>
  <rect x="0" y="0" width="1280" height="64" fill="#FFFFFF"/>
  <line x1="0" y1="64" x2="1280" y2="64" stroke="#E3DFD5"/>
  <text x="48" y="32.0" dominant-baseline="middle" font-family="'Source Serif 4', Georgia, serif" font-size="18" font-weight="600" fill="#3E4C74">StudyStack</text>
  <rect x="1154" y="12.0" width="78" height="40" rx="8" fill="#6B675E"/>
  <text x="1193.0" y="32.0" text-anchor="middle" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Logout</text>
  <!-- Manage Cards behind the dialog -->
  <text x="48" y="108" dominant-baseline="middle" font-family="'Source Serif 4', Georgia, serif" font-size="28" font-weight="600" fill="#2A2924">C# Fundamentals</text>
  <rect x="48" y="144" width="1184" height="76" rx="8" fill="#FFFFFF" stroke="#E3DFD5"/>
  <text x="64" y="172" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="15" font-weight="600" fill="#2A2924">What is dependency injection?</text>
  <text x="64" y="194" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="13" fill="#6B675E">A way to give a class what it needs...</text>
  <rect x="0" y="0" width="1280" height="800" fill="#000000" opacity="0.45"/>
  <!-- Card editor -->
  <clipPath id="dlg"><rect x="320.0" y="150" width="640" height="499" rx="14"/></clipPath>
  <rect x="320.0" y="150" width="640" height="499" rx="14" fill="#FFFFFF" stroke="#E3DFD5"/>
  <g clip-path="url(#dlg)">
  <text x="352.0" y="197.4" dominant-baseline="middle" font-family="'Source Serif 4', Georgia, serif" font-size="22" font-weight="600" fill="#2A2924">Add Card</text>
  <path d="M918.0,191.4 L930.0,203.4 M930.0,191.4 L918.0,203.4" stroke="#6B675E" stroke-width="1.7" stroke-linecap="round"/>
  <text x="352.0" y="242.3" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#6B675E" letter-spacing="1">QUESTION</text>
  <rect x="352.0" y="255.8" width="576" height="100" rx="8" fill="#FBFAF6" stroke="#E3DFD5"/>
  <text x="366.0" y="277.8" dominant-baseline="middle" font-family="'JetBrains Mono', monospace" font-size="14" fill="#2A2924">What does the `async` keyword</text>
  <text x="366.0" y="299.8" dominant-baseline="middle" font-family="'JetBrains Mono', monospace" font-size="14" fill="#2A2924">actually do in C#?</text>
  <text x="352.0" y="385.3" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#6B675E" letter-spacing="1">ANSWER</text>
  <rect x="352.0" y="398.8" width="576" height="100" rx="8" fill="#FBFAF6" stroke="#E3DFD5"/>
  <text x="366.0" y="420.8" dominant-baseline="middle" font-family="'JetBrains Mono', monospace" font-size="14" fill="#2A2924">It marks a method as asynchronous,</text>
  <text x="366.0" y="442.8" dominant-baseline="middle" font-family="'JetBrains Mono', monospace" font-size="14" fill="#2A2924">so awaited calls can yield...</text>
  <rect x="352.0" y="522.8" width="40" height="22" rx="11" fill="#5E8272"/><circle cx="381.0" cy="533.8" r="8" fill="#FFFFFF"/>
  <text x="404.0" y="533.8" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="14" fill="#2A2924">Monospace font</text>
  <!-- Formatting help: a text button; aria-expanded shows whether the panel is open -->
  <text x="910.0" y="533.8" text-anchor="end" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="14" font-weight="500" fill="#3E4C74">Formatting help</text>
  <path d="M917.0,531.8 L922.0,536.8 L927.0,531.8" fill="none" stroke="#3E4C74" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="832.0" y="576.8" width="96" height="40" rx="8" fill="#3E4C74"/>
  <text x="880.0" y="596.8" text-anchor="middle" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">Save</text>
  <text x="822.0" y="596.8" text-anchor="end" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="15" fill="#6B675E">Cancel</text>
  </g>
</svg>
