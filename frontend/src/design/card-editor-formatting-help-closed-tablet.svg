<svg xmlns="http://www.w3.org/2000/svg" width="768" height="1024" viewBox="0 0 768 1024">
  <rect width="768" height="1024" fill="#F6F4EF"/>
  <rect x="0" y="0" width="768" height="60" fill="#FFFFFF"/>
  <line x1="0" y1="60" x2="768" y2="60" stroke="#E3DFD5"/>
  <text x="32" y="30.0" dominant-baseline="middle" font-family="'Source Serif 4', Georgia, serif" font-size="20" font-weight="600" fill="#3E4C74">StudyStack</text>
  <rect x="658" y="10.0" width="78" height="40" rx="8" fill="#6B675E"/>
  <text x="697.0" y="30.0" text-anchor="middle" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Logout</text>
  <!-- Manage Cards behind the dialog -->
  <text x="32" y="104" dominant-baseline="middle" font-family="'Source Serif 4', Georgia, serif" font-size="28" font-weight="600" fill="#2A2924">C# Fundamentals</text>
  <rect x="32" y="140" width="704" height="76" rx="8" fill="#FFFFFF" stroke="#E3DFD5"/>
  <text x="48" y="168" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="15" font-weight="600" fill="#2A2924">What is dependency injection?</text>
  <text x="48" y="190" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="13" fill="#6B675E">A way to give a class what it needs...</text>
  <rect x="0" y="0" width="768" height="1024" fill="#000000" opacity="0.45"/>
  <!-- Card editor -->
  <clipPath id="dlg"><rect x="104.0" y="232" width="560" height="561" rx="14"/></clipPath>
  <rect x="104.0" y="232" width="560" height="561" rx="14" fill="#FFFFFF" stroke="#E3DFD5"/>
  <g clip-path="url(#dlg)">
  <text x="136.0" y="279.4" dominant-baseline="middle" font-family="'Source Serif 4', Georgia, serif" font-size="22" font-weight="600" fill="#2A2924">Add Card</text>
  <path d="M622.0,273.4 L634.0,285.4 M634.0,273.4 L622.0,285.4" stroke="#6B675E" stroke-width="1.7" stroke-linecap="round"/>
  <text x="136.0" y="324.8" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#6B675E" letter-spacing="1">QUESTION</text>
  <rect x="136.0" y="338.8" width="496" height="130" rx="8" fill="#FBFAF6" stroke="#E3DFD5"/>
  <text x="150.0" y="360.8" dominant-baseline="middle" font-family="'JetBrains Mono', monospace" font-size="14" fill="#2A2924">What does the `async` keyword</text>
  <text x="150.0" y="382.8" dominant-baseline="middle" font-family="'JetBrains Mono', monospace" font-size="14" fill="#2A2924">actually do in C#?</text>
  <text x="136.0" y="498.8" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#6B675E" letter-spacing="1">ANSWER</text>
  <rect x="136.0" y="512.8" width="496" height="130" rx="8" fill="#FBFAF6" stroke="#E3DFD5"/>
  <text x="150.0" y="534.8" dominant-baseline="middle" font-family="'JetBrains Mono', monospace" font-size="14" fill="#2A2924">It marks a method as asynchronous,</text>
  <text x="150.0" y="556.8" dominant-baseline="middle" font-family="'JetBrains Mono', monospace" font-size="14" fill="#2A2924">so awaited calls can yield...</text>
  <rect x="136.0" y="666.8" width="40" height="22" rx="11" fill="#5E8272"/><circle cx="165.0" cy="677.8" r="8" fill="#FFFFFF"/>
  <text x="188.0" y="677.8" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="15" fill="#2A2924">Monospace font</text>
  <!-- Formatting help: a text button; aria-expanded shows whether the panel is open -->
  <text x="614.0" y="677.8" text-anchor="end" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="15" font-weight="500" fill="#3E4C74">Formatting help</text>
  <path d="M621.0,675.8 L626.0,680.8 L631.0,675.8" fill="none" stroke="#3E4C74" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="536.0" y="720.8" width="96" height="40" rx="8" fill="#3E4C74"/>
  <text x="584.0" y="740.8" text-anchor="middle" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">Save</text>
  <text x="526.0" y="740.8" text-anchor="end" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="15" fill="#6B675E">Cancel</text>
  </g>
</svg>
