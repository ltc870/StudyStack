<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <rect width="1280" height="800" fill="#F6F4EF"/>
  <rect x="0" y="0" width="1280" height="64" fill="#FFFFFF"/>
  <line x1="0" y1="64" x2="1280" y2="64" stroke="#E3DFD5"/>
  <text x="48" y="32.0" dominant-baseline="middle" font-family="'Source Serif 4', Georgia, serif" font-size="18" font-weight="600" fill="#3E4C74">StudyStack</text>
  <rect x="1154" y="12.0" width="78" height="40" rx="8" fill="#6B675E"/>
  <text x="1193.0" y="32.0" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#FFFFFF">Logout</text>
  <!-- Manage Cards behind the dialog -->
  <text x="48" y="108" dominant-baseline="middle" font-family="'Source Serif 4', Georgia, serif" font-size="28" font-weight="600" fill="#2A2924">C# Fundamentals</text>
  <rect x="48" y="144" width="1184" height="76" rx="8" fill="#FFFFFF" stroke="#E3DFD5"/>
  <text x="64" y="172" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="15" font-weight="600" fill="#2A2924">What does async do in C#?</text>
  <rect x="0" y="0" width="1280" height="800" rx="0" fill="#000000" opacity="0.45"/>
  <!-- Card editor -->
  <clipPath id="dlg"><rect x="320.0" y="112" width="640" height="576.5" rx="14"/></clipPath>
  <rect x="320.0" y="112" width="640" height="576.5" rx="14" fill="#FFFFFF" stroke="#E3DFD5"/>
  <g clip-path="url(#dlg)">
  <text x="352.0" y="159" dominant-baseline="middle" font-family="'Source Serif 4', Georgia, serif" font-size="22" font-weight="600" fill="#2A2924">Edit Card</text>
  <path d="M912.0,153 L924.0,165 M924.0,153 L912.0,165" stroke="#6B675E" stroke-width="1.7" stroke-linecap="round"/>
  <text x="352.0" y="204" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="600" letter-spacing="1" fill="#6B675E">QUESTION</text>
  <rect x="352.0" y="217.5" width="576" height="100" rx="8" fill="#FBFAF6" stroke="#E3DFD5"/>
  <text x="366.0" y="239.5" dominant-baseline="middle" font-family="'JetBrains Mono', monospace" font-size="14" fill="#2A2924">What does the `async` keyword</text>
  <text x="366.0" y="261.5" dominant-baseline="middle" font-family="'JetBrains Mono', monospace" font-size="14" fill="#2A2924">actually do in C#?</text>
  <text x="352.0" y="347.0" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="600" letter-spacing="1" fill="#6B675E">ANSWER</text>
  <rect x="352.0" y="360.5" width="576" height="100" rx="8" fill="#FBFAF6" stroke="#E3DFD5"/>
  <text x="366.0" y="382.5" dominant-baseline="middle" font-family="'JetBrains Mono', monospace" font-size="14" fill="#2A2924">It marks a method as asynchronous,</text>
  <text x="366.0" y="404.5" dominant-baseline="middle" font-family="'JetBrains Mono', monospace" font-size="14" fill="#2A2924">so awaited calls can yield...</text>
  <!-- NEW: Substack, a native select; "Not in a substack" is the first option -->
  <text x="352.0" y="490.0" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="600" letter-spacing="1" fill="#6B675E">SUBSTACK</text>
  <rect x="352.0" y="503.5" width="576" height="40" rx="8" fill="#FFFFFF" stroke="#E3DFD5"/>
  <text x="366.0" y="523.5" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="14" fill="#2A2924">Async/Await</text>
  <path d="M905.0,521.0 L910.0,526.0 L915.0,521.0" fill="none" stroke="#6B675E" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="352.0" y="561.5" width="40" height="22" rx="11" fill="#5E8272"/>
  <circle cx="381.0" cy="572.5" r="8" fill="#FFFFFF"/>
  <text x="404.0" y="572.5" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="14" fill="#2A2924">Monospace font</text>
  <text x="910.0" y="572.5" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="14" font-weight="500" text-anchor="end" fill="#3E4C74">Formatting help</text>
  <path d="M915.0,570.0 L920.0,575.0 L925.0,570.0" fill="none" stroke="#3E4C74" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="832.0" y="616.5" width="96" height="40" rx="8" fill="#3E4C74"/>
  <text x="880.0" y="636.5" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#FFFFFF">Save</text>
  <text x="822.0" y="636.5" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="15" text-anchor="end" fill="#6B675E">Cancel</text>
  </g>
  <text x="640.0" y="786" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle" font-style="italic" fill="#6B675E">Substack sits under Answer. A new card starts on Not in a substack; saving a change moves the card.</text>
</svg>
