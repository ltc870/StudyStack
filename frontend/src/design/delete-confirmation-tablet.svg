  <text x="52" y="254" font-family="'Inter', sans-serif" font-size="20" font-weight="600" fill="#2A2924">C# Fundamentals</text>
  <text x="52" y="280" font-family="'Inter', sans-serif" font-size="15" fill="#6B675E">24 cards</text>
  <g transform="translate(660,258) rotate(45) scale(1.3)" stroke-linecap="round" stroke-linejoin="round">
    <rect x="-2" y="-8" width="4" height="12" rx="1" fill="none" stroke="#6B675E" stroke-width="1.5"/>
    <path d="M-2,4 L0,9 L2,4 Z" fill="#6B675E"/>
    <line x1="-2" y1="-3" x2="2" y2="-3" stroke="#6B675E" stroke-width="1.5"/>
  </g>
  <g transform="translate(704,256) scale(1.3)">
