  <text x="32" y="30" dominant-baseline="middle" font-family="'Source Serif 4', Georgia, serif" font-size="20" font-weight="600" fill="#3E4C74">StudyStack</text>
  <circle cx="718" cy="30" r="18" fill="#3E4C74"/>
  <text x="718" y="30" text-anchor="middle" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">LC</text>
  <path d="M44,92 L34,102 L44,112" fill="none" stroke="#2A2924" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="60" y="108" font-family="'Source Serif 4', Georgia, serif" font-size="28" font-weight="600" fill="#2A2924">Manage Stacks</text>
