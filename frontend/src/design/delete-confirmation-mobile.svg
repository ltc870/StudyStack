<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <rect width="390" height="844" fill="#F6F4EF"/>
  <rect x="0" y="0" width="390" height="48" fill="#FFFFFF"/>
  <line x1="0" y1="48" x2="390" y2="48" stroke="#E3DFD5"/>
  <text x="16" y="24" dominant-baseline="middle" font-family="'Source Serif 4', Georgia, serif" font-size="15" font-weight="600" fill="#3E4C74">StudyStack</text>
  <circle cx="366" cy="24" r="14" fill="#3E4C74"/>
  <text x="366" y="24" text-anchor="middle" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">LC</text>

  <path d="M28,80 L20,88 L28,96" fill="none" stroke="#2A2924" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="44" y="88" font-family="'Source Serif 4', Georgia, serif" font-size="22" font-weight="600" fill="#2A2924">Manage Stacks</text>

  <rect x="20" y="164" width="350" height="76" rx="8" fill="#FFFFFF" stroke="#E3DFD5"/>
  <text x="36" y="194" font-family="'Inter', sans-serif" font-size="16" font-weight="600" fill="#2A2924">C# Fundamentals</text>
  <text x="36" y="216" font-family="'Inter', sans-serif" font-size="13" fill="#6B675E">24 cards</text>

  <rect x="0" y="0" width="390" height="844" fill="#000000" opacity="0.45"/>

  <rect x="20" y="330" width="350" height="220" rx="14" fill="#FFFFFF" stroke="#E3DFD5"/>

  <g transform="translate(56,364) scale(1.6)">
    <rect x="-7" y="-6" width="14" height="3" rx="1" fill="#B15C3E"/>
    <rect x="-5" y="-2" width="10" height="14" rx="2" fill="none" stroke="#B15C3E" stroke-width="1.5"/>
    <line x1="-2" y1="1" x2="-2" y2="9" stroke="#B15C3E" stroke-width="1.5"/>
    <line x1="2" y1="1" x2="2" y2="9" stroke="#B15C3E" stroke-width="1.5"/>
  </g>
  <text x="100" y="372" font-family="'Source Serif 4', Georgia, serif" font-size="19" font-weight="600" fill="#2A2924">Delete stack?</text>

  <text x="40" y="406" font-family="'Inter', sans-serif" font-size="14" fill="#6B675E">
    <tspan x="40" dy="0">This will permanently delete</tspan>
    <tspan x="40" dy="20">"C# Fundamentals" and all 24</tspan>
    <tspan x="40" dy="20">of its cards. This cannot be</tspan>
    <tspan x="40" dy="20">undone.</tspan>
  </text>

  <text x="290" y="522" text-anchor="end" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="15" fill="#6B675E">Cancel</text>
  <rect x="270" y="502" width="80" height="40" rx="8" fill="#B15C3E"/>
  <text x="310" y="522" text-anchor="middle" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">Delete</text>
</svg>
