<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <rect width="1280" height="800" fill="#F6F4EF"/>
  <rect x="0" y="0" width="1280" height="64" fill="#FFFFFF"/>
  <line x1="0" y1="64" x2="1280" y2="64" stroke="#E3DFD5"/>
  <text x="48" y="32.0" dominant-baseline="middle" font-family="'Source Serif 4', Georgia, serif" font-size="18" font-weight="600" fill="#3E4C74">StudyStack</text>
  <rect x="1154" y="12.0" width="78" height="40" rx="8" fill="#6B675E"/>
  <text x="1193.0" y="32.0" text-anchor="middle" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Logout</text>
  <!-- Manage Cards behind the dialog -->
  <text x="48" y="108" dominant-baseline="middle" font-family="'Source Serif 4', Georgia, serif" font-size="28" font-weight="600" fill="#2A2924">C# Fundamentals</text>
  <rect x="48" y="144" width="1184" height="76" rx="8" fill="#FFFFFF" stroke="#E3DFD5"/>
  <text x="64" y="172" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="15" font-weight="600" fill="#2A2924">What is dependency injection?</text>
  <text x="64" y="194" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="13" fill="#6B675E">A way to give a class what it needs...</text>
  <rect x="0" y="0" width="1280" height="800" fill="#000000" opacity="0.45"/>
  <!-- Card editor with Formatting help open; taller than the window, so it scrolls inside itself (shown scrolled to the bottom) -->
  <clipPath id="dlg"><rect x="320.0" y="16" width="640" height="768" rx="14"/></clipPath>
  <rect x="320.0" y="16" width="640" height="768" rx="14" fill="#FFFFFF" stroke="#E3DFD5"/>
  <g clip-path="url(#dlg)">
  <text x="352.0" y="-38.6" dominant-baseline="middle" font-family="'Source Serif 4', Georgia, serif" font-size="22" font-weight="600" fill="#2A2924">Add Card</text>
  <path d="M918.0,-44.6 L930.0,-32.6 M930.0,-44.6 L918.0,-32.6" stroke="#6B675E" stroke-width="1.7" stroke-linecap="round"/>
  <text x="352.0" y="6.299999999999997" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#6B675E" letter-spacing="1">QUESTION</text>
  <rect x="352.0" y="19.799999999999997" width="576" height="100" rx="8" fill="#FBFAF6" stroke="#E3DFD5"/>
  <text x="366.0" y="41.8" dominant-baseline="middle" font-family="'JetBrains Mono', monospace" font-size="14" fill="#2A2924">What does the `async` keyword</text>
  <text x="366.0" y="63.8" dominant-baseline="middle" font-family="'JetBrains Mono', monospace" font-size="14" fill="#2A2924">actually do in C#?</text>
  <text x="352.0" y="149.3" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#6B675E" letter-spacing="1">ANSWER</text>
  <rect x="352.0" y="162.8" width="576" height="100" rx="8" fill="#FBFAF6" stroke="#E3DFD5"/>
  <text x="366.0" y="184.8" dominant-baseline="middle" font-family="'JetBrains Mono', monospace" font-size="14" fill="#2A2924">It marks a method as asynchronous,</text>
  <text x="366.0" y="206.8" dominant-baseline="middle" font-family="'JetBrains Mono', monospace" font-size="14" fill="#2A2924">so awaited calls can yield...</text>
  <rect x="352.0" y="286.8" width="40" height="22" rx="11" fill="#5E8272"/><circle cx="381.0" cy="297.8" r="8" fill="#FFFFFF"/>
  <text x="404.0" y="297.8" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="14" fill="#2A2924">Monospace font</text>
  <!-- Formatting help: a text button; aria-expanded shows whether the panel is open -->
  <text x="910.0" y="297.8" text-anchor="end" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="14" font-weight="500" fill="#3E4C74">Formatting help</text>
  <path d="M917.0,300.8 L922.0,295.8 L927.0,300.8" fill="none" stroke="#3E4C74" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="352.5" y="325.3" width="575" height="354" rx="8" fill="#FBFAF6" stroke="#E3DFD5"/>
  <text x="368.0" y="346.8" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#6B675E" letter-spacing="1">YOU TYPE</text>
  <text x="568.0" y="346.8" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#6B675E" letter-spacing="1">YOU GET</text>
  <line x1="368.0" y1="364.8" x2="912.0" y2="364.8" stroke="#E3DFD5"/>
  <text x="368.0" y="380.8" dominant-baseline="middle" font-family="'JetBrains Mono', monospace" font-size="13.5" fill="#2A2924">**bold**</text>
  <text x="568.0" y="380.8" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#2A2924">bold</text>
  <line x1="368.0" y1="396.8" x2="912.0" y2="396.8" stroke="#E3DFD5"/>
  <text x="368.0" y="412.8" dominant-baseline="middle" font-family="'JetBrains Mono', monospace" font-size="13.5" fill="#2A2924">*italic*</text>
  <text x="568.0" y="412.8" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="14" fill="#2A2924" font-style="italic">italic</text>
  <line x1="368.0" y1="428.8" x2="912.0" y2="428.8" stroke="#E3DFD5"/>
  <text x="368.0" y="444.8" dominant-baseline="middle" font-family="'JetBrains Mono', monospace" font-size="13.5" fill="#2A2924">- item</text>
  <circle cx="572.0" cy="444.8" r="2.5" fill="#2A2924"/>
  <text x="582.0" y="444.8" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="14" fill="#2A2924">item</text>
  <line x1="368.0" y1="460.8" x2="912.0" y2="460.8" stroke="#E3DFD5"/>
  <text x="368.0" y="476.8" dominant-baseline="middle" font-family="'JetBrains Mono', monospace" font-size="13.5" fill="#2A2924">1. item</text>
  <text x="568.0" y="476.8" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="14" fill="#2A2924">1.  item</text>
  <line x1="368.0" y1="492.8" x2="912.0" y2="492.8" stroke="#E3DFD5"/>
  <text x="368.0" y="508.8" dominant-baseline="middle" font-family="'JetBrains Mono', monospace" font-size="13.5" fill="#2A2924">`List&lt;User&gt;`</text>
  <rect x="566.0" y="497.8" width="91" height="22" rx="4" fill="#F6F4EF"/>
  <text x="571.0" y="508.8" dominant-baseline="middle" font-family="'JetBrains Mono', monospace" font-size="13.5" fill="#2A2924">List&lt;User&gt;</text>
  <line x1="368.0" y1="524.8" x2="912.0" y2="524.8" stroke="#E3DFD5"/>
  <text x="368.0" y="542.8" dominant-baseline="middle" font-family="'JetBrains Mono', monospace" font-size="13.5" fill="#2A2924">```csharp</text>
  <text x="368.0" y="560.8" dominant-baseline="middle" font-family="'JetBrains Mono', monospace" font-size="13.5" fill="#2A2924">var count = 1;</text>
  <text x="368.0" y="578.8" dominant-baseline="middle" font-family="'JetBrains Mono', monospace" font-size="13.5" fill="#2A2924">```</text>
  <rect x="568.0" y="533.8" width="344.0" height="54" rx="6" fill="#F6F4EF" stroke="#E3DFD5"/>
  <text x="578.0" y="560.8" dominant-baseline="middle" font-family="'JetBrains Mono', monospace" font-size="13.5"><tspan fill="#3E4C74">var</tspan><tspan fill="#2A2924"> count = </tspan><tspan fill="#96492F">1</tspan><tspan fill="#6B675E">;</tspan></text>
  <text x="368.0" y="617.8" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="13" fill="#6B675E">Code colors: csharp, typescript, javascript, html, css, scss, sql, json, bash, c,</text>
  <text x="368.0" y="636.8" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="13" fill="#6B675E">cpp, python, java.</text>
  <text x="368.0" y="655.8" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="13" fill="#6B675E">Press Enter once for a new line.</text>
  <rect x="832.0" y="711.8" width="96" height="40" rx="8" fill="#3E4C74"/>
  <text x="880.0" y="731.8" text-anchor="middle" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">Save</text>
  <text x="822.0" y="731.8" text-anchor="end" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="15" fill="#6B675E">Cancel</text>
  </g>
</svg>
