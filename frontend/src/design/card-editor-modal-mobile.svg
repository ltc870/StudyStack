<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="390" height="844" fill="#FFFFFF"/>
  <rect x="0" y="0" width="390" height="56" fill="#FFFFFF"/>
  <line x1="0" y1="56" x2="390" y2="56" stroke="#E3DFD5"/>
  <text x="20" y="28" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="15" fill="#6B675E">Cancel</text>
  <text x="195" y="28" text-anchor="middle" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#2A2924">Add Card</text>
  <text x="370" y="28" text-anchor="end" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="15" font-weight="600" fill="#3E4C74">Save</text>

  <text x="20" y="90" font-family="'Inter', sans-serif" font-size="11" font-weight="600" letter-spacing="1" fill="#6B675E">QUESTION</text>
  <rect x="20" y="100" width="350" height="140" rx="8" fill="#FBFAF6" stroke="#E3DFD5"/>
  <text x="32" y="128" font-family="'JetBrains Mono', monospace" font-size="14" fill="#2A2924">
    <tspan x="32" dy="0">What does the `async`</tspan>
    <tspan x="32" dy="22">keyword actually do</tspan>
    <tspan x="32" dy="22">in C#?</tspan>
  </text>

  <text x="20" y="266" font-family="'Inter', sans-serif" font-size="11" font-weight="600" letter-spacing="1" fill="#6B675E">ANSWER</text>
  <rect x="20" y="276" width="350" height="140" rx="8" fill="#FBFAF6" stroke="#E3DFD5"/>
  <text x="32" y="304" font-family="'JetBrains Mono', monospace" font-size="14" fill="#2A2924">
    <tspan x="32" dy="0">It marks a method as</tspan>
    <tspan x="32" dy="22">asynchronous, allowing</tspan>
    <tspan x="32" dy="22">awaited calls to yield...</tspan>
  </text>

  <rect x="20" y="444" width="40" height="22" rx="11" fill="#5E8272"/>
  <circle cx="49" cy="455" r="9" fill="#FFFFFF"/>
  <text x="72" y="455" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="14" fill="#2A2924">Monospace font</text>
</svg>
