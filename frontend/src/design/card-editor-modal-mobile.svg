<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <rect width="390" height="844" fill="#F6F4EF"/>
  <!-- dimmed Manage Cards screen behind the modal -->
  <rect x="0" y="0" width="390" height="48" fill="#FFFFFF"/>
  <line x1="0" y1="48" x2="390" y2="48" stroke="#E3DFD5"/>
  <text x="16" y="24" dominant-baseline="middle" font-family="'Source Serif 4', Georgia, serif" font-size="15" font-weight="600" fill="#3E4C74">StudyStack</text>
  <circle cx="366" cy="24" r="14" fill="#3E4C74"/>
  <text x="366" y="24" text-anchor="middle" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">LC</text>

  <text x="20" y="88" font-family="'Source Serif 4', Georgia, serif" font-size="22" font-weight="600" fill="#2A2924">C# Fundamentals</text>

  <rect x="20" y="120" width="350" height="76" rx="8" fill="#FFFFFF" stroke="#E3DFD5"/>
  <text x="36" y="150" font-family="'Inter', sans-serif" font-size="15" font-weight="600" fill="#2A2924">What is dependency injection...</text>
  <text x="36" y="172" font-family="'Inter', sans-serif" font-size="13" fill="#6B675E">...and why does ASP.NET Core use it?</text>

  <rect x="0" y="0" width="390" height="844" fill="#000000" opacity="0.45"/>

  <!-- modal dialog -->
  <rect x="20" y="170" width="350" height="486" rx="14" fill="#FFFFFF" stroke="#E3DFD5"/>

  <text x="40" y="210" font-family="'Source Serif 4', Georgia, serif" font-size="19" font-weight="600" fill="#2A2924">Add Card</text>
  <g transform="translate(346,202)" stroke="#6B675E" stroke-width="1.8" stroke-linecap="round">
    <line x1="-6" y1="-6" x2="6" y2="6"/>
    <line x1="6" y1="-6" x2="-6" y2="6"/>
  </g>

  <text x="40" y="248" font-family="'Inter', sans-serif" font-size="11" font-weight="600" letter-spacing="1" fill="#6B675E">QUESTION</text>
  <rect x="40" y="258" width="310" height="110" rx="8" fill="#FBFAF6" stroke="#E3DFD5"/>
  <text x="54" y="284" font-family="'JetBrains Mono', monospace" font-size="14" fill="#2A2924">
    <tspan x="54" dy="0">What does the `async`</tspan>
    <tspan x="54" dy="22">keyword actually do</tspan>
    <tspan x="54" dy="22">in C#?</tspan>
  </text>

  <text x="40" y="396" font-family="'Inter', sans-serif" font-size="11" font-weight="600" letter-spacing="1" fill="#6B675E">ANSWER</text>
  <rect x="40" y="406" width="310" height="110" rx="8" fill="#FBFAF6" stroke="#E3DFD5"/>
  <text x="54" y="432" font-family="'JetBrains Mono', monospace" font-size="14" fill="#2A2924">
    <tspan x="54" dy="0">It marks a method as</tspan>
    <tspan x="54" dy="22">asynchronous, allowing</tspan>
    <tspan x="54" dy="22">awaited calls to yield...</tspan>
  </text>

  <rect x="40" y="544" width="40" height="22" rx="11" fill="#5E8272"/>
  <circle cx="69" cy="555" r="9" fill="#FFFFFF"/>
  <text x="92" y="555" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="14" fill="#2A2924">Monospace font</text>

  <text x="256" y="616" text-anchor="end" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="15" fill="#6B675E">Cancel</text>
  <rect x="266" y="596" width="84" height="40" rx="8" fill="#3E4C74"/>
  <text x="308" y="616" text-anchor="middle" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">Save</text>
</svg>
