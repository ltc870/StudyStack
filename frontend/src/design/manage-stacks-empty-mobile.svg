<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <rect width="390" height="844" fill="#F6F4EF"/>
  <rect x="0" y="0" width="390" height="48" fill="#FFFFFF"/>
  <line x1="0" y1="48" x2="390" y2="48" stroke="#E3DFD5"/>
  <text x="16" y="24" dominant-baseline="middle" font-family="'Source Serif 4', Georgia, serif" font-size="15" font-weight="600" fill="#3E4C74">StudyStack</text>
  <circle cx="366" cy="24" r="14" fill="#3E4C74"/>
  <text x="366" y="24" text-anchor="middle" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">LC</text>

  <path d="M28,80 L20,88 L28,96" fill="none" stroke="#2A2924" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="44" y="88" font-family="'Source Serif 4', Georgia, serif" font-size="22" font-weight="600" fill="#2A2924">Manage Stacks</text>

  <circle cx="195" cy="340" r="36" fill="#3E4C74"/>
  <g transform="translate(195,340)" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round">
    <line x1="-12" y1="0" x2="12" y2="0"/>
    <line x1="0" y1="-12" x2="0" y2="12"/>
  </g>

  <text x="195" y="420" text-anchor="middle" font-family="'Source Serif 4', Georgia, serif" font-size="22" font-weight="600" fill="#2A2924">No stacks yet</text>
  <text x="195" y="448" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" fill="#6B675E">
    <tspan x="195" dy="0">Create your first stack to</tspan>
    <tspan x="195" dy="20">start adding cards.</tspan>
  </text>

  <rect x="115" y="490" width="160" height="48" rx="24" fill="#3E4C74"/>
  <text x="195" y="514" text-anchor="middle" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">Add a Stack!</text>

  <circle cx="342" cy="792" r="28" fill="#3E4C74"/>
  <g transform="translate(342,792)" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round">
    <line x1="-9" y1="0" x2="9" y2="0"/>
    <line x1="0" y1="-9" x2="0" y2="9"/>
  </g>
</svg>
