  <text x="70" y="342.4" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="15" font-weight="600" fill="#2A2924">When to use ConfigureAwait(false)?</text>
  <text x="70" y="363.68" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="13" fill="#6B675E">In library async code, so...</text>
