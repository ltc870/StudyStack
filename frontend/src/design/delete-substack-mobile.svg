<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <rect width="390" height="844" fill="#F6F4EF"/>
  <rect x="0" y="0" width="390" height="48" fill="#FFFFFF"/>
  <line x1="0" y1="48" x2="390" y2="48" stroke="#E3DFD5"/>
  <text x="20" y="24.0" dominant-baseline="middle" font-family="'Source Serif 4', Georgia, serif" font-size="15" font-weight="600" fill="#3E4C74">StudyStack</text>
  <rect x="300" y="7.0" width="70" height="34" rx="8" fill="#6B675E"/>
  <text x="335.0" y="24.0" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#FFFFFF">Logout</text>
  <!-- Manage Substacks behind the dialog -->
  <text x="44" y="72" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="600" letter-spacing="1" fill="#6B675E">C# FUNDAMENTALS</text>
  <path d="M28,90 L20,98 L28,106" fill="none" stroke="#2A2924" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="44" y="98" dominant-baseline="middle" font-family="'Source Serif 4', Georgia, serif" font-size="22" font-weight="600" fill="#2A2924">Substacks</text>
  <rect x="0" y="0" width="390" height="844" rx="0" fill="#000000" opacity="0.45"/>
  <rect x="20.0" y="302" width="350" height="240" rx="14" fill="#FFFFFF" stroke="#E3DFD5"/>
  <g transform="translate(58.0,340) scale(1.6)"><rect x="-7" y="-6" width="14" height="3" rx="1" fill="#B15C3E"/><rect x="-5" y="-2" width="10" height="14" rx="2" fill="none" stroke="#B15C3E" stroke-width="1.5"/><line x1="-2" y1="1" x2="-2" y2="9" stroke="#B15C3E" stroke-width="1.5"/><line x1="2" y1="1" x2="2" y2="9" stroke="#B15C3E" stroke-width="1.5"/></g>
  <text x="86.0" y="344" dominant-baseline="middle" font-family="'Source Serif 4', Georgia, serif" font-size="20" font-weight="600" fill="#2A2924">Delete substack?</text>
  <text x="44.0" y="388" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="14" fill="#6B675E">This will delete "Async/Await". Its</text>
  <text x="44.0" y="408" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="14" fill="#6B675E">2 cards stay in C# Fundamentals,</text>
  <text x="44.0" y="428" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="14" fill="#6B675E">under Not in a substack. This</text>
  <text x="44.0" y="448" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="14" fill="#6B675E">cannot be undone.</text>
  <rect x="252.0" y="478" width="94" height="40" rx="8" fill="#B15C3E"/>
  <text x="299.0" y="498" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#FFFFFF">Delete</text>
  <text x="232.0" y="498" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="15" text-anchor="end" fill="#6B675E">Cancel</text>
  <text x="195.0" y="815" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle" font-style="italic" fill="#6B675E">Deleting a substack keeps its cards:</text>
  <text x="195.0" y="830" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle" font-style="italic" fill="#6B675E">they move to Not in a substack.</text>
</svg>
