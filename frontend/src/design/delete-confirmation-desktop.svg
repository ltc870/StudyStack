<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <rect width="1280" height="800" fill="#F6F4EF"/>
  <rect x="0" y="0" width="1280" height="64" fill="#FFFFFF"/>
  <line x1="0" y1="64" x2="1280" y2="64" stroke="#E3DFD5"/>
  <text x="48" y="32" dominant-baseline="middle" font-family="'Source Serif 4', Georgia, serif" font-size="18" font-weight="600" fill="#3E4C74">StudyStack</text>
  <circle cx="1214" cy="32" r="18" fill="#3E4C74"/>
  <text x="1214" y="32" text-anchor="middle" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">LC</text>

  <path d="M56,104 L48,112 L56,120" fill="none" stroke="#2A2924" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="72" y="112" font-family="'Source Serif 4', Georgia, serif" font-size="28" font-weight="600" fill="#2A2924">Manage Stacks</text>

  <rect x="48" y="160" width="378" height="96" rx="10" fill="#FFFFFF" stroke="#E3DFD5"/>
  <text x="68" y="200" font-family="'Inter', sans-serif" font-size="18" font-weight="600" fill="#2A2924">C# Fundamentals</text>
  <text x="68" y="226" font-family="'Inter', sans-serif" font-size="14" fill="#6B675E">24 cards</text>

  <rect x="451" y="160" width="378" height="96" rx="10" fill="#FFFFFF" stroke="#E3DFD5"/>
  <text x="471" y="200" font-family="'Inter', sans-serif" font-size="18" font-weight="600" fill="#2A2924">EF Core Patterns</text>
  <text x="471" y="226" font-family="'Inter', sans-serif" font-size="14" fill="#6B675E">12 cards</text>

  <rect x="0" y="0" width="1280" height="800" fill="#000000" opacity="0.45"/>

  <rect x="420" y="290" width="440" height="220" rx="14" fill="#FFFFFF" stroke="#E3DFD5"/>

  <g transform="translate(466,334) scale(1.6)">
    <rect x="-7" y="-6" width="14" height="3" rx="1" fill="#B15C3E"/>
    <rect x="-5" y="-2" width="10" height="14" rx="2" fill="none" stroke="#B15C3E" stroke-width="1.5"/>
    <line x1="-2" y1="1" x2="-2" y2="9" stroke="#B15C3E" stroke-width="1.5"/>
    <line x1="2" y1="1" x2="2" y2="9" stroke="#B15C3E" stroke-width="1.5"/>
  </g>
  <text x="494" y="342" font-family="'Source Serif 4', Georgia, serif" font-size="20" font-weight="600" fill="#2A2924">Delete stack?</text>

  <text x="452" y="384" font-family="'Inter', sans-serif" font-size="14" fill="#6B675E">
    <tspan x="452" dy="0">This will permanently delete "C# Fundamentals" and all 24</tspan>
    <tspan x="452" dy="20">of its cards. This cannot be undone.</tspan>
  </text>

  <text x="714" y="470" text-anchor="end" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="15" fill="#6B675E">Cancel</text>
  <rect x="734" y="450" width="94" height="40" rx="8" fill="#B15C3E"/>
  <text x="781" y="470" text-anchor="middle" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">Delete</text>
</svg>
