  <text x="72" y="194" font-family="'Inter', sans-serif" font-size="17" font-weight="600" fill="#2A2924">What is dependency injection and why does ASP.NET Core use it by default?</text>
  <text x="72" y="220" font-family="'Inter', sans-serif" font-size="14" fill="#6B675E">A design pattern where dependencies are supplied by an external source...</text>
