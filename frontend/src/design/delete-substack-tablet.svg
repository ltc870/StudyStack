  <line x1="0" y1="60" x2="768" y2="60" stroke="#E3DFD5"/>
  <text x="32" y="30.0" dominant-baseline="middle" font-family="'Source Serif 4', Georgia, serif" font-size="20" font-weight="600" fill="#3E4C74">StudyStack</text>
  <rect x="658" y="10.0" width="78" height="40" rx="8" fill="#6B675E"/>
  <text x="697.0" y="30.0" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#FFFFFF">Logout</text>
  <!-- Manage Substacks behind the dialog -->
  <text x="61" y="84" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="600" letter-spacing="1" fill="#6B675E">C# FUNDAMENTALS</text>
  <path d="M46,104 L38,112 L46,120" fill="none" stroke="#2A2924" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="61" y="112" dominant-baseline="middle" font-family="'Source Serif 4', Georgia, serif" font-size="28" font-weight="600" fill="#2A2924">Substacks</text>
  <rect x="0" y="0" width="768" height="1024" rx="0" fill="#000000" opacity="0.45"/>
  <rect x="144.0" y="394" width="480" height="236" rx="14" fill="#FFFFFF" stroke="#E3DFD5"/>
  <g transform="translate(190.0,440) scale(1.6)"><rect x="-7" y="-6" width="14" height="3" rx="1" fill="#B15C3E"/><rect x="-5" y="-2" width="10" height="14" rx="2" fill="none" stroke="#B15C3E" stroke-width="1.5"/><line x1="-2" y1="1" x2="-2" y2="9" stroke="#B15C3E" stroke-width="1.5"/><line x1="2" y1="1" x2="2" y2="9" stroke="#B15C3E" stroke-width="1.5"/></g>
  <text x="218.0" y="444" dominant-baseline="middle" font-family="'Source Serif 4', Georgia, serif" font-size="20" font-weight="600" fill="#2A2924">Delete substack?</text>
  <text x="176.0" y="488" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="14" fill="#6B675E">This will delete "Async/Await". Its 2 cards</text>
  <text x="176.0" y="508" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="14" fill="#6B675E">stay in C# Fundamentals, under Not in a</text>
  <text x="176.0" y="528" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="14" fill="#6B675E">substack. This cannot be undone.</text>
  <rect x="498.0" y="558" width="94" height="40" rx="8" fill="#B15C3E"/>
  <text x="545.0" y="578" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#FFFFFF">Delete</text>
  <text x="478.0" y="578" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="15" text-anchor="end" fill="#6B675E">Cancel</text>
  <text x="384.0" y="1010" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle" font-style="italic" fill="#6B675E">Deleting a substack keeps its cards: they move to Not in a substack.</text>
