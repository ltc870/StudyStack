<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <rect width="1280" height="800" fill="#F6F4EF"/>
  <rect x="0" y="0" width="1280" height="64" fill="#FFFFFF"/>
  <line x1="0" y1="64" x2="1280" y2="64" stroke="#E3DFD5"/>
  <text x="48" y="32.0" dominant-baseline="middle" font-family="'Source Serif 4', Georgia, serif" font-size="18" font-weight="600" fill="#3E4C74">StudyStack</text>
  <rect x="1154" y="12.0" width="78" height="40" rx="8" fill="#6B675E"/>
  <text x="1193.0" y="32.0" text-anchor="middle" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Logout</text>
  <path d="M61,108 L53,116 L61,124" fill="none" stroke="#2A2924" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="77" y="118" dominant-baseline="middle" font-family="'Source Serif 4', Georgia, serif" font-size="28" font-weight="600" fill="#2A2924">Updates</text>
  <text x="48" y="154" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="15" fill="#6B675E">What changed in each release, newest first.</text>
  <!-- Release notes: one card per release, newest first; the list scrolls with the page -->
  <rect x="48.5" y="184.5" width="759" height="187" rx="12" fill="#FFFFFF" stroke="#E3DFD5"/>
  <text x="72" y="219.9" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#6B675E" letter-spacing="1">OCT 21, 2026</text>
  <text x="208" y="219.9" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="17" font-weight="600" fill="#2A2924">Jump to any card</text>
  <circle cx="212" cy="251.1" r="2.5" fill="#6B675E"/>
  <text x="226" y="251.1" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="15" fill="#2A2924">Tap Cards on the Study screen (the panel icon next to the stack name on a</text>
  <text x="226" y="273.6" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="15" fill="#2A2924">phone) to see every card in the stack. Tap one to jump straight to it; the</text>
  <text x="226" y="296.1" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="15" fill="#2A2924">list stays open.</text>
  <circle cx="212" cy="318.6" r="2.5" fill="#6B675E"/>
  <text x="226" y="318.6" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="15" fill="#2A2924">On an iPhone in landscape, the top bar now reaches the edges of the</text>
  <text x="226" y="341.1" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="15" fill="#2A2924">screen.</text>
  <rect x="48.5" y="388.5" width="759" height="97" rx="12" fill="#FFFFFF" stroke="#E3DFD5"/>
  <text x="72" y="423.9" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#6B675E" letter-spacing="1">OCT 20, 2026</text>
  <text x="208" y="423.9" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="17" font-weight="600" fill="#2A2924">Faster start</text>
  <circle cx="212" cy="455.0" r="2.5" fill="#6B675E"/>
  <text x="226" y="455.0" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="15" fill="#2A2924">StudyStack opens faster, because it downloads less when it starts.</text>
  <rect x="48.5" y="502.5" width="759" height="142" rx="12" fill="#FFFFFF" stroke="#E3DFD5"/>
  <text x="72" y="537.9" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#6B675E" letter-spacing="1">OCT 14, 2026</text>
  <text x="208" y="537.9" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="17" font-weight="600" fill="#2A2924">Format your cards</text>
  <circle cx="212" cy="569.0" r="2.5" fill="#6B675E"/>
  <text x="226" y="569.0" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="15" fill="#2A2924">Questions and answers now support markdown: bold, italics, lists, code,</text>
  <text x="226" y="591.5" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="15" fill="#2A2924">and code blocks with colors.</text>
  <circle cx="212" cy="614.0" r="2.5" fill="#6B675E"/>
  <text x="226" y="614.0" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="15" fill="#2A2924">Tap Formatting help in the card editor to see how.</text>
  <rect x="48.5" y="661.5" width="759" height="210" rx="12" fill="#FFFFFF" stroke="#E3DFD5"/>
  <text x="72" y="696.9" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#6B675E" letter-spacing="1">OCT 12, 2026</text>
  <text x="208" y="696.9" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="17" font-weight="600" fill="#2A2924">StudyStack is online</text>
  <circle cx="212" cy="728.0" r="2.5" fill="#6B675E"/>
  <text x="226" y="728.0" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="15" fill="#2A2924">Make stacks of cards, each with a question and an answer, and find any of</text>
  <text x="226" y="750.5" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="15" fill="#2A2924">them with search.</text>
  <circle cx="212" cy="773.0" r="2.5" fill="#6B675E"/>
  <text x="226" y="773.0" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="15" fill="#2A2924">Study a stack: Flip shows the answer, and Previous and Next move between</text>
  <text x="226" y="795.5" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="15" fill="#2A2924">cards.</text>
  <circle cx="212" cy="818.0" r="2.5" fill="#6B675E"/>
  <text x="226" y="818.0" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="15" fill="#2A2924">Turn on Monospace font in the card editor for cards that are mostly code.</text>
  <circle cx="212" cy="840.5" r="2.5" fill="#6B675E"/>
  <text x="226" y="840.5" dominant-baseline="middle" font-family="'Inter', sans-serif" font-size="15" fill="#2A2924">Add it to your home screen: in Safari, tap Share, then Add to Home Screen.</text>
</svg>
