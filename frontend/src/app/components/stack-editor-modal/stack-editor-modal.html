<div class="modal-backdrop" (click)="cancel.emit()">
  <div class="stack-editor-modal-container" (click)="$event.stopPropagation()">
    <h2 class="modal-title">{{ title() }}</h2>
    <button aria-label="Close" class="modal-close-button" (click)="cancel.emit()">
      <ng-icon name="remixCloseFill" class="close-icon" />
    </button>
    <label for="stack-name-input" class="stack-name-input-label">STACK NAME</label>
    <input
      type="text"
      id="stack-name-input"
      class="stack-name-input"
      placeholder="e.g. C# Fundamentals"
      [value]="name()"
      (input)="setName($event)"
      (keydown.enter)="onEnter()"
    />
    <div class="cancel-save-buttons-container">
      <button class="cancel-button" (click)="cancel.emit()">Cancel</button>
      <button class="save-button" [disabled]="!canSave()" (click)="save.emit(name())">Save</button>
    </div>
  </div>
</div>
